<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulation Replay</title>
<style>
:root {
  --bg: #f6f3ee; --panel: #ffffff; --panel-2: #f0ece5; --ink: #1f1b16; --muted: #6f675c;
  --line: #ddd5c8; --accent: #b4621d; --hl: #fff1c9; --board: #ebe5da; --sand: #f3e3c3; --sand-line: #dcc493;
  --p0: #2f6fd6; --p1: #c23b3b; --p2: #2a9a5b; --p3: #8a4fc7;
  --f-emperor: #8c6d1f; --f-guild: #b8541f; --f-bene_gesserit: #5b5b8f; --f-fremen: #2f7f8f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15130f; --panel: #1f1c17; --panel-2: #2a261f; --ink: #ece6dc; --muted: #a39a8c;
    --line: #3a342b; --accent: #e08a3c; --hl: #4a3d1c; --board: #1a1712; --sand: #3a2e19; --sand-line: #5a4622;
    --p0: #6aa0ff; --p1: #ff7a7a; --p2: #5fd08f; --p3: #c08cff;
    --f-emperor: #d6b04f; --f-guild: #f0884a; --f-bene_gesserit: #9a9ae0; --f-fremen: #5fc3d4;
  }
}
:root[data-theme="dark"] {
  --bg: #15130f; --panel: #1f1c17; --panel-2: #2a261f; --ink: #ece6dc; --muted: #a39a8c;
  --line: #3a342b; --accent: #e08a3c; --hl: #4a3d1c; --board: #1a1712; --sand: #3a2e19; --sand-line: #5a4622;
  --p0: #6aa0ff; --p1: #ff7a7a; --p2: #5fd08f; --p3: #c08cff;
  --f-emperor: #d6b04f; --f-guild: #f0884a; --f-bene_gesserit: #9a9ae0; --f-fremen: #5fc3d4;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
h1 { font-size: 15px; margin: 0; font-weight: 650; }
.muted { color: var(--muted); }
.controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
button, select { font: inherit; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); min-width: 64px; }
input[type=range] { width: min(320px, 60vw); accent-color: var(--accent); }
.step { font-variant-numeric: tabular-nums; min-width: 110px; }
main { padding: 12px 16px 24px; display: grid; gap: 12px;
  grid-template-columns: minmax(0, 1fr); grid-template-areas: "event" "players" "board" "log"; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.event { grid-area: event; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.event .msg { font-size: 15px; font-weight: 600; flex: 1 1 300px; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--panel-2);
  border: 1px solid var(--line); font-size: 12px; white-space: nowrap; }
.board { grid-area: board; display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 1250px) { .board { grid-template-columns: minmax(0, 1fr) 300px; } }
.side { display: grid; gap: 12px; align-content: start; min-width: 0; grid-template-columns: minmax(0, 1fr); }
.side .rank span:first-child { min-width: 0; overflow-wrap: anywhere; }
.h { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.gameboard { background: var(--board); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: grid; gap: 10px;
  grid-template-columns: minmax(0, 1fr); grid-template-areas: "landsraad" "choam" "factions" "arrakis" "conflict"; }
@media (min-width: 900px) { .gameboard { grid-template-columns: 300px minmax(0, 2.4fr) minmax(0, 1fr);
  grid-template-areas: "factions landsraad choam" "factions arrakis arrakis" "factions conflict conflict"; } }
.region { border-radius: 10px; padding: 8px; background: var(--panel); border: 1px solid var(--line); min-width: 0; }
.region h3 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.region.factions { grid-area: factions; display: grid; gap: 8px; background: none; border: 0; padding: 0; align-content: start; }
.region.landsraad { grid-area: landsraad; } .region.choam { grid-area: choam; }
.region.arrakis { grid-area: arrakis; background: var(--sand); border-color: var(--sand-line); }
.region.conflictzone { grid-area: conflict; border-top: 3px solid var(--accent); }
.faction { border-radius: 10px; padding: 8px; background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--fc); }
.faction h3 { color: var(--fc); display: flex; justify-content: space-between; }
.faction .ally { letter-spacing: 0; text-transform: none; font-weight: 650; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.track { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-top: 6px; }
.track .cell { min-height: 24px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); padding: 1px 2px;
  display: flex; flex-wrap: wrap; gap: 2px; align-items: center; align-content: center; position: relative; }
.track .cell .n { font-size: 10px; color: var(--muted); width: 100%; line-height: 1; }
.track .cell.vpmark, .track .cell.allymark { border-color: var(--fc); }
.track .cell.allymark { border-width: 2px; }
.track .dot { width: 8px; height: 8px; }
.tiles { display: grid; gap: 6px; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--panel-2); display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.arrakis .tile { background: var(--panel); }
.tile.maker { border-style: dashed; }
.tile .nm { font-weight: 650; display: flex; justify-content: space-between; gap: 6px; }
.tile .ic { font-size: 11px; }
.tile .cost { font-size: 11px; color: var(--accent); font-weight: 600; }
.tile .fx, .fx { color: var(--muted); font-size: 12px; }
.tile .fx.bonus { color: var(--accent); font-weight: 600; }
.tile .slot { margin-top: auto; padding-top: 4px; display: flex; align-items: center; gap: 5px; font-size: 12px; min-height: 22px; }
.pawn { width: 14px; height: 14px; border-radius: 50% 50% 4px 4px; display: inline-block; flex: none; }
.pawn.none { background: none; border: 1px dashed var(--line); }
.tile.occ { border-width: 2px; }
.tile.flash { background: var(--hl); }
.cz { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 700px) { .cz { grid-template-columns: 220px minmax(0, 1fr); } }
.ccard { border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--panel-2); }
.armies { display: grid; gap: 4px; align-content: start; }
.army { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto 28px auto; gap: 8px; align-items: center; font-size: 12px; }
.army b { font-size: 15px; text-align: right; font-variant-numeric: tabular-nums; }
.cube { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 2px; }
.mrow { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }
.mcard { border: 1px solid var(--line); border-top: 4px solid var(--fc); border-radius: 6px; padding: 5px 7px; background: var(--panel-2); position: relative; min-height: 62px; }
.mcard .mc { position: absolute; top: 4px; right: 6px; font-weight: 700; color: var(--accent); }
.mcard .mn { font-weight: 600; font-size: 12px; padding-right: 16px; }
.mcard .mt { font-size: 11px; color: var(--muted); }
.agent { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.conflict { border-top: 3px solid var(--accent); }
.rank { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
.log { grid-area: log; max-height: 340px; overflow: auto; padding: 0; position: relative; }
.log h3 { position: sticky; top: 0; background: var(--panel); margin: 0; padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--line); }
.log ol { list-style: none; margin: 0; padding: 4px 0; }
.log li.round { border-top: 1px solid var(--line); padding-top: 6px; }
.log li { padding: 3px 12px; cursor: pointer; border-left: 3px solid transparent; font-size: 12px; }
.log li:hover { background: var(--panel-2); }
.log li.cur { background: var(--hl); border-left-color: var(--accent); }
.log li.round { font-weight: 650; margin-top: 6px; }
.log li .note { color: var(--muted); display: block; padding-left: 10px; }
.players { grid-area: players; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.pl { border-top: 4px solid var(--pc); }
.pl.active { box-shadow: 0 0 0 2px var(--pc); }
.pl .top { display: flex; justify-content: space-between; align-items: baseline; }
.pl .nm { font-weight: 700; font-size: 15px; color: var(--pc); }
.vp { font-size: 26px; font-weight: 750; font-variant-numeric: tabular-nums; line-height: 1; }
.vp small { font-size: 12px; font-weight: 500; color: var(--muted); }
.res { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin: 8px 0; }
.res div { background: var(--panel-2); border-radius: 6px; padding: 3px 6px; text-align: center; }
.res b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
.res span { font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.inf { display: grid; grid-template-columns: 96px 1fr 18px; gap: 4px 6px; align-items: center; font-size: 12px; }
.bar { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; }
.bar i { height: 8px; border-radius: 2px; background: var(--line); }
.bar i.on { background: var(--fc); }
.bar i.t { outline: 1px dashed var(--muted); outline-offset: 1px; }
.zone { margin-top: 6px; font-size: 12px; }
.zone b { color: var(--muted); font-weight: 600; margin-right: 4px; }
.cards { display: inline; }
.cards span { display: inline-block; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin: 1px 2px 1px 0; }
.empty { text-align: center; padding: 60px 16px; }
.win { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
<header>
  <h1>Simulation Replay</h1>
  <span id="meta" class="muted"></span>
  <div class="controls">
    <button id="first" title="First (Home)">⏮</button>
    <button id="prevRound" title="Previous round (Shift+←)">« R</button>
    <button id="prev" title="Back (←)">◀</button>
    <button id="play" class="primary" title="Play/Pause (Space)">Play</button>
    <button id="next" title="Forward (→)">▶</button>
    <button id="nextRound" title="Next round (Shift+→)">R »</button>
    <button id="last" title="Last (End)">⏭</button>
    <select id="speed" title="Playback speed">
      <option value="1500">0.5×</option><option value="800" selected>1×</option>
      <option value="400">2×</option><option value="150">5×</option>
    </select>
  </div>
  <input id="slider" type="range" min="0" value="0">
  <span id="step" class="step muted"></span>
  <label class="muted" style="margin-left:auto">Load replay JSON <input id="file" type="file" accept=".json"></label>
</header>
<main id="app"><div class="card empty" style="grid-column:1/-1">No replay embedded. Run <code>python -m dune_sim watch ...</code> or load a replay JSON.</div></main>

<script>
const EMBEDDED = /*__REPLAY__*/null;
const FACTIONS = ["emperor", "guild", "bene_gesserit", "fremen"];
const FLABEL = {emperor: "Emperor", guild: "Spacing Guild", bene_gesserit: "Bene Gesserit", fremen: "Fremen"};
const AREA_ORDER = ["Emperor", "Spacing Guild", "Bene Gesserit", "Fremen", "Landsraad", "CHOAM", "Arrakis", "Desert"];
const AREA_COLOR = {Emperor: "--f-emperor", "Spacing Guild": "--f-guild", "Bene Gesserit": "--f-bene_gesserit", Fremen: "--f-fremen"};
let R = null, i = 0, timer = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pc = (k) => `var(--p${k % 4})`;
const costStr = (c) => Object.entries(c || {}).map(([k, v]) => `${v} ${k}`).join(", ");
const cards = (arr) => arr.length ? `<span class="cards">${arr.map(n => `<span>${esc(n)}</span>`).join("")}</span>` : `<span class="muted">—</span>`;

function load(rep) {
  R = rep; i = 0; stop();
  $("slider").max = R.frames.length - 1;
  const res = R.meta.result;
  $("meta").textContent = `seed ${R.meta.seed} · ${R.meta.specs.join(" vs ")} · winner: ` +
    res.winners.map(w => `${res.players[w].name} (${res.players[w].strategy})`).join(", ");
  $("app").innerHTML = `
    <section class="card event" id="event"></section>
    <section class="board" id="board"></section>
    <aside class="card log"><h3>Game log</h3><ol id="log"></ol></aside>
    <section class="players" id="players"></section>`;
  buildLog();
  render();
}

function buildLog() {
  $("log").innerHTML = R.frames.map((f, k) => {
    const round = f.msg.startsWith("Round ") || f.msg.startsWith("Game");
    const notes = (f.notes || []).map(n => `<span class="note">${esc(n)}</span>`).join("");
    const dot = f.actor != null ? `<span class="dot" style="background:${pc(f.actor)}"></span> ` : "";
    return `<li data-k="${k}" class="${round ? "round" : ""}">${dot}${esc(f.msg)}${notes}</li>`;
  }).join("");
  $("log").onclick = (e) => { const li = e.target.closest("li"); if (li) { stop(); go(+li.dataset.k); } };
}

function render() {
  const f = R.frames[i], s = f.state, prev = i > 0 ? R.frames[i - 1].state : null;
  $("slider").value = i;
  $("step").textContent = `step ${i + 1}/${R.frames.length}`;
  const names = s.players.map(p => p.name);

  // event bar
  const cf = s.conflict;
  $("event").innerHTML = `
    <span class="chip">Round ${s.round || "–"}</span>
    <span class="chip">${esc(s.phase)}</span>
    <span class="msg">${f.actor != null ? `<span class="dot" style="background:${pc(f.actor)}"></span> ` : ""}${esc(f.msg)}</span>
    <span class="chip">First player: ${esc(names[s.first])}</span>
    <span class="chip">Conflicts left: ${s.conflicts_left}</span>`;

  // board laid out like the table: factions down the left, Landsraad and CHOAM across
  // the top, Arrakis (cities and desert) in the middle, the conflict at the bottom
  const byArea = {};
  R.spaces.forEach(sp => (byArea[sp.area] = byArea[sp.area] || []).push(sp));
  const ICON = {emperor: "◆", guild: "⬢", bene_gesserit: "●", fremen: "▲", landsraad: "■", spice_trade: "◈", city: "⬟"};
  const tile = (sp) => {
    const b = s.board[sp.name], pb = prev && prev.board[sp.name];
    const occ = b.agent != null;
    const flash = occ && (!pb || pb.agent !== b.agent);
    const cost = sp.cost && Object.keys(sp.cost).length ? costStr(sp.cost) : "";
    const req = Object.keys(sp.requires || {}).length ? "needs " + Object.entries(sp.requires).map(([k, v]) => `${v} ${FLABEL[k]}`).join("") : "";
    const fcol = FACTIONS.includes(sp.icon) ? `var(--f-${sp.icon})` : "var(--muted)";
    return `<div class="tile ${occ ? "occ" : ""} ${flash ? "flash" : ""} ${sp.maker ? "maker" : ""}" style="${occ ? `border-color:${pc(b.agent)}` : ""}">
      <div class="nm"><span><span class="ic" style="color:${fcol}" title="${esc(sp.icon.replace("_", " "))} space">${ICON[sp.icon] || "•"}</span> ${esc(sp.name)}</span>${sp.combat ? `<span class="muted" title="combat space: troops may be deployed">⚔</span>` : ""}</div>
      ${cost || req ? `<div class="cost">${esc([cost && "cost " + cost, req].filter(Boolean).join(" · "))}</div>` : ""}
      <div class="fx">${esc(sp.effect)}</div>
      ${b.bonus ? `<div class="fx bonus">+${b.bonus} bonus spice</div>` : ""}
      ${b.control != null ? `<div class="fx">control: <b style="color:${pc(b.control)}">${esc(names[b.control])}</b></div>` : ""}
      <div class="slot">${occ ? `<span class="pawn" style="background:${pc(b.agent)}"></span><span style="color:${pc(b.agent)};font-weight:650">${esc(names[b.agent])}</span>` : `<span class="pawn none"></span>`}</div>
    </div>`;
  };
  const tiles = (area) => (byArea[area] || []).map(tile).join("");
  const factionStrip = (fa) => {
    const ally = s.alliance[fa];
    const cells = [0, 1, 2, 3, 4, 5, 6].map(n => {
      const here = s.players.map((p, k) => p.influence[fa] === n ? `<span class="dot" style="background:${pc(k)}" title="${esc(names[k])}: ${n}"></span>` : "").join("");
      return `<div class="cell ${n === 2 ? "vpmark" : ""} ${n === 4 ? "allymark" : ""}" title="${n === 2 ? "2 influence: 1 VP" : n === 4 ? "4 influence: alliance" : ""}"><span class="n">${n}</span>${here}</div>`;
    }).join("");
    return `<div class="faction" style="--fc:var(--f-${fa})">
      <h3>${FLABEL[fa]}${ally != null ? ` <span class="ally" style="color:${pc(ally)}">★ ${esc(names[ally])}</span>` : ""}</h3>
      <div class="pair">${tiles(FLABEL[fa])}</div>
      <div class="track">${cells}</div>
    </div>`;
  };
  const cubes = (n, k) => n ? Array.from({length: Math.min(n, 12)}, () => `<i class="cube" style="background:${pc(k)}"></i>`).join("") + (n > 12 ? ` +${n - 12}` : "") : `<span class="muted">—</span>`;
  let conflictHtml = `<span class="muted">No conflict revealed</span>`;
  if (cf) {
    const order = s.players.map((p, k) => ({p, k})).sort((a, b) => b.p.strength - a.p.strength);
    conflictHtml = `<div class="ccard"><div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.06em">Conflict · level ${cf.level}</div>
        <div style="font-weight:650;font-size:14px">${esc(cf.name)}</div>
        ${cf.control ? `<div class="fx">control of ${esc(cf.control)}</div>` : ""}
        ${cf.rewards.map((r, k) => `<div class="fx">${["1st", "2nd", "3rd"][k]}: ${esc(r)}</div>`).join("")}</div>
      <div class="armies">${order.map(x => `<div class="army">
          <span style="color:${pc(x.k)};font-weight:650">${esc(x.p.name)}</span>
          <span class="cubes" title="troops in the conflict">${cubes(x.p.conflict, x.k)}</span>
          <span class="muted">${x.p.conflict ? (x.p.revealed ? x.p.swords + " swords" : "swords hidden") : ""}</span>
          <b title="strength">${x.p.strength}</b>
          <span class="muted" title="troops in garrison">garrison ${x.p.garrison}</span></div>`).join("")}</div>`;
  }
  let html = `<div class="gameboard">
      <div class="region factions">${FACTIONS.map(factionStrip).join("")}</div>
      <div class="region landsraad"><h3>Landsraad</h3><div class="tiles">${tiles("Landsraad")}</div></div>
      <div class="region choam"><h3>CHOAM</h3><div class="tiles">${tiles("CHOAM")}</div></div>
      <div class="region arrakis"><h3>Arrakis</h3><div class="tiles">${tiles("Arrakis")}</div>
        <h3 style="margin-top:10px">Deep desert · makers</h3><div class="tiles">${tiles("Desert")}</div></div>
      <div class="region conflictzone"><h3>Conflict</h3><div class="cz">${conflictHtml}</div></div>
    </div>`;
  let side = "";
  {
    const row = s.row.map(c => `<div class="mcard" style="--fc:${c.type ? `var(--f-${c.type})` : "var(--line)"}"><div class="mc">${c.cost}</div><div class="mn">${esc(c.name)}</div><div class="mt">${c.type ? FLABEL[c.type] : "no type"}</div></div>`).join("");
    side += `<div class="card"><h3 class="h">Imperium row</h3><div class="mrow">${row}</div>
      <div class="fx muted" style="margin-top:6px">Reserve: ${Object.entries(s.reserve).map(([k, v]) => `${esc(k)} ×${v}`).join(" · ")}</div></div>`;
  }
  // decision panel: what the acting agent could do and how it scored each option
  const d = f.decision;
  if (d) {
    const top = d.options.slice(0, 8).map(o => `<div class="rank" style="${o.chosen ? "font-weight:700;color:var(--accent)" : ""}">
        <span>${o.chosen ? "▶ " : ""}${esc(o.label)}</span><span>${o.score == null ? "n/a" : o.score.toFixed(2)}</span></div>`).join("");
    side += `<div class="card conflict"><h3 class="h">Decision · ${esc(names[d.actor])}</h3>
      <div class="fx muted">${d.n_options} legal options · ${d.ms} ms${d.rule ? " · " + esc(d.rule) : ""} · utility score per option</div>
      ${d.fallback ? `<div class="fx" style="color:var(--p1)">Fallback: ${esc(d.fallback)} → reveal turn</div>` : ""}
      <div style="margin-top:4px">${top}</div>
      ${d.n_options > 8 ? `<div class="fx muted">… ${d.n_options - 8} more</div>` : ""}</div>`;
  }
  $("board").innerHTML = html + `<div class="side">${side}</div>`;

  // players
  const res = R.meta.result;
  const lastFrame = i === R.frames.length - 1;
  $("players").innerHTML = s.players.map((p, k) => {
    const inf = FACTIONS.map(fa => {
      const ally = s.alliance[fa] === k;
      const bars = [1,2,3,4,5,6].map(n => `<i class="${p.influence[fa] >= n ? "on" : ""} ${n === 2 || n === 4 ? "t" : ""}"></i>`).join("");
      return `<span>${FLABEL[fa]}</span><span class="bar" style="--fc:var(--f-${fa})">${bars}</span><span title="alliance">${ally ? "★" : ""}</span>`;
    }).join("");
    const agents = Array.from({length: p.agents_total}, (_, n) => `<span class="dot" style="background:${n < p.agents_used ? "var(--line)" : pc(k)}"></span>`).join(" ");
    const won = lastFrame && res.winners.includes(k);
    return `<div class="card pl ${f.actor === k ? "active" : ""}" style="--pc:${pc(k)}">
      <div class="top"><div><div class="nm">${esc(p.name)} ${s.first === k ? "<span class='chip'>first</span>" : ""} ${won ? "<span class='win'>WINNER</span>" : ""}</div>
        <div class="muted">${esc(p.strategy)}</div>
        ${p.leader ? `<div title="${esc(p.leader.ability)} Signet: ${esc(p.leader.signet)}" style="font-weight:600">${esc(p.leader.name)}</div>` : ""}</div>
        <div class="vp">${p.vp}<small> VP</small></div></div>
      <div class="res">
        <div><b>${p.spice}</b><span>spice</span></div><div><b>${p.solari}</b><span>solari</span></div>
        <div><b>${p.water}</b><span>water</span></div><div><b>${p.garrison}</b><span>garrison</span></div>
        <div><b>${p.conflict}</b><span>in conflict</span></div><div><b>${p.strength}</b><span>strength</span></div>
        <div><b>${p.persuasion}</b><span>persuasion</span></div><div><b>${p.intrigue.length}</b><span>intrigue</span></div>
      </div>
      <div class="inf">${inf}</div>
      ${p.leader ? `<div class="zone muted">${esc(p.leader.ability)}<br>Signet: ${esc(p.leader.signet)}</div>` : ""}
      <div class="zone"><b>Agents</b> ${agents} ${p.seat ? "<span class='chip'>High Council</span>" : ""} ${p.revealed ? "<span class='chip'>revealed</span>" : ""}</div>
      ${p.held ? `<div class="zone"><b>Reserved</b><span class="chip">${esc(p.held.name)} (${p.held.cost})</span></div>` : ""}
      <div class="zone"><b>Hand</b>${cards(p.hand)}</div>
      <div class="zone"><b>Played</b>${cards(p.in_play)}</div>
      ${p.revealed_cards.length ? `<div class="zone"><b>Revealed</b>${cards(p.revealed_cards)}</div>` : ""}
      <div class="zone"><b>Intrigue</b>${cards(p.intrigue)}</div>
      <div class="zone muted">Deck ${p.deck} · Discard ${p.discard} · ${p.deck_total} cards owned</div>
    </div>`;
  }).join("");

  // log highlight
  const lis = $("log").children;
  for (const li of lis) li.classList.remove("cur");
  if (lis[i]) { lis[i].classList.add("cur"); const box = lis[i].closest(".log"); box.scrollTop = lis[i].offsetTop - box.clientHeight / 2; }
}

function go(k) { if (!R) return; i = Math.max(0, Math.min(R.frames.length - 1, k)); render(); }
function jumpRound(dir) {
  if (!R) return;
  const isR = (k) => R.frames[k].msg.startsWith("Round ");
  let k = i + dir;
  while (k > 0 && k < R.frames.length - 1 && !isR(k)) k += dir;
  go(k);
}
function stop() { clearInterval(timer); timer = null; $("play").textContent = "Play"; }
function play() {
  if (!R) return;
  if (timer) return stop();
  if (i >= R.frames.length - 1) i = 0;
  $("play").textContent = "Pause";
  timer = setInterval(() => { if (i >= R.frames.length - 1) stop(); else go(i + 1); }, +$("speed").value);
}
$("first").onclick = () => { stop(); go(0); };
$("last").onclick = () => { stop(); go(1e9); };
$("prev").onclick = () => { stop(); go(i - 1); };
$("next").onclick = () => { stop(); go(i + 1); };
$("prevRound").onclick = () => { stop(); jumpRound(-1); };
$("nextRound").onclick = () => { stop(); jumpRound(1); };
$("play").onclick = play;
$("speed").onchange = () => { if (timer) { stop(); play(); } };
$("slider").oninput = (e) => { stop(); go(+e.target.value); };
$("file").onchange = async (e) => { const f = e.target.files[0]; if (f) load(JSON.parse(await f.text())); };
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" && e.target.type !== "range") return;
  if (e.key === "ArrowRight") { stop(); e.shiftKey ? jumpRound(1) : go(i + 1); e.preventDefault(); }
  else if (e.key === "ArrowLeft") { stop(); e.shiftKey ? jumpRound(-1) : go(i - 1); e.preventDefault(); }
  else if (e.key === " ") { play(); e.preventDefault(); }
  else if (e.key === "Home") { stop(); go(0); }
  else if (e.key === "End") { stop(); go(1e9); }
});
if (EMBEDDED) {
  load(EMBEDDED);
  const m = /step=(\d+)/.exec(location.hash);   // e.g. game.html#step=45 opens at that step
  if (m) go(+m[1] - 1);
}
</script>
</body>
</html>
